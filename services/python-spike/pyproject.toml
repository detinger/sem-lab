[project]
name = "sem-studio-python-spike"
version = "0.0.0"
description = "Phase 0 verification spike for semopy and plspm (evidence in docs/validation/phase-0). Not part of the application."
requires-python = "==3.12.*"
# Exact pins. They are the result of the Phase 0 compatibility matrix, not of taste:
# see docs/validation/phase-0/python-spike.md and
# docs/validation/phase-0/evidence/python/compat_matrix.json before changing any of them.
#   * pandas must stay < 3.0  -> plspm 0.5.7 cannot estimate any model on pandas >= 3.0
#   * scipy  must stay < 1.14 -> semopy 2.3.11 polychoric/ordinal route needs scipy.stats.mvn.mvnun
#   * numpy  must stay < 2.4  -> semopy 2.3.11 calls np.ma.corrcoef(bias=...) (removed in numpy 2.4);
#                                scipy 1.13.1 itself requires numpy < 2.3
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.13.1",
    "semopy==2.3.11",
    "plspm==0.5.7",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
# A set of verification scripts, not a distributable library: nothing to build or install.
package = false
# plspm imports statsmodels (OLS for the inner model and the path scheme) and scikit-learn
# (PCA for unidimensionality) directly, so their versions can move numbers. They are
# transitive dependencies, therefore pinned here (and in uv.lock) instead of being listed
# as our own. Every other transitive package is pinned by uv.lock only.
constraint-dependencies = [
    "statsmodels==0.14.6",
    "scikit-learn==1.7.2",
]

# The spike scripts are frozen Phase 0 evidence; they are run, not linted or tested here.
