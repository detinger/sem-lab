# SEM Lab continuous integration.
# Jobs mirror the local commands documented in README.md; nothing here is CI-only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web + contracts + registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Third-party notices are current and all licences are permitted
        run: node scripts/third-party-notices.mjs --check
      - run: npm run format:check
      - run: npm run test
      - name: JSON Schema is up to date with the Zod contracts
        run: npm run check-schema --workspace @sem-lab/contracts
      - run: npm run build

  fixtures:
    name: synthetic fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate in memory and compare byte-for-byte
        # Also the first run on Linux: the generator was only verified on macOS arm64.
        run: uv run --python 3.12 --with numpy python packages/fixtures/scripts/generate_synthetic.py --check

  notebooks:
    name: Colab notebooks (current build; headless execution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Python 3.12 with current numpy / scipy / pandas / matplotlib, close to a Colab runtime
      # (versions pinned in notebooks/uv.lock).
      - name: Notebooks are built from the current sources, engine bundle and fixtures
        working-directory: notebooks
        run: uv run --frozen --python 3.12 python build_notebooks.py --check
      - name: Execute every notebook headless; compare with the Python engine on the fixtures
        working-directory: notebooks
        run: uv run --frozen --python 3.12 pytest -q -rs

  python-engine:
    name: Python engine (semlab, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the cross-language tests run the TypeScript engine (packages/engine) with node
      - run: npm ci
      - uses: astral-sh/setup-uv@v5
      - name: Single-file bundle is up to date
        working-directory: packages/python-engine
        run: uv run --frozen --python ${{ matrix.python }} python scripts/bundle.py --check
      - name: pytest (package and bundle; R, lavaan, population and TypeScript parity)
        working-directory: packages/python-engine
        env:
          SEMLAB_REQUIRE_NODE: '1'
        run: uv run --frozen --python ${{ matrix.python }} pytest -q -rs

  r-engine:
    name: R engine (cSEM reference tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # the engine tests validate result.json with the contracts' ajv
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.2'
          use-public-rspm: true
      - name: Cache the project R library
        uses: actions/cache@v4
        with:
          path: services/r-engine/r-lib
          key: r-lib-${{ runner.os }}-${{ hashFiles('services/r-engine/renv.lock') }}
      - name: Restore pinned R packages into services/r-engine/r-lib
        run: |
          mkdir -p services/r-engine/r-lib
          Rscript -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")'
          Rscript -e 'renv::restore(lockfile = "services/r-engine/renv.lock", library = "services/r-engine/r-lib", prompt = FALSE)'
      - name: Engine tests (synthetic reference fixtures; TAM parity tests skip without TEMP data)
        run: services/r-engine/bin/test
      - name: Exported R scripts reproduce the browser engine (cSEM and lavaan)
        run: npx vitest run --root apps/web src/features/code-export
