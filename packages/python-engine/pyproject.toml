[project]
name = "semstudio"
version = "0.1.0"
description = "SEM Studio's verified estimation engine (PLS-SEM, PLSc, CB-SEM ML/MLR/FIML) in Python: reproduces the app's numbers exactly. Mirrors @sem-studio/engine 0.1.0."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SEM Studio licence (same terms as the SEM Studio repository); see README.md" }
dependencies = [
    "numpy>=1.22.4,<3",
    "scipy>=1.12,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.4,<10",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
