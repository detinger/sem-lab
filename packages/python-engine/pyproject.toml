[project]
name = "semlab"
version = "0.1.0"
description = "SEM Lab's verified estimation engine (PLS-SEM, PLSc, CB-SEM ML/MLR/FIML) in Python: reproduces the app's numbers exactly. Mirrors @sem-lab/engine 0.1.0."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22.4,<3",
    "scipy>=1.12,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.4,<10",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
