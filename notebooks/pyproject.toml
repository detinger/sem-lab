[project]
name = "sem-lab-notebooks"
version = "0.1.0"
description = "Build and test environment for SEM Lab's Colab notebooks (notebooks/colab). Mirrors a current Google Colab runtime: Python 3.12 with numpy, scipy, pandas and matplotlib."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
test = [
    "pytest>=8",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]
# Optional cross-check in 05_service_quality_cb_sem.ipynb (pinned there too).
crosscheck = [
    "semopy==2.3.11",
]

[tool.uv]
default-groups = ["test", "crosscheck"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
