# Local stack: the API (with the R engine). The web dev server stays `npm run dev` on the host.
#   docker compose up --build
# Not verified on the machine this was written on (no Docker installed there).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      MAX_CSV_MB: ${MAX_CSV_MB:-25}
      MAX_BOOTSTRAP_REPS: ${MAX_BOOTSTRAP_REPS:-10000}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      DATA_RETENTION_HOURS: ${DATA_RETENTION_HOURS:-24}
    volumes:
      - sem-data:/data
    restart: unless-stopped

volumes:
  sem-data:
